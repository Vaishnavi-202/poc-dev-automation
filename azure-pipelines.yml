trigger:
  branches:
    include:
      - POC_SMOKE

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build Docker Image
  jobs:
  - job: Build
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        dockerfile: Dockerfile
        repository: poc-dev-automation
        tags: |
          latest
