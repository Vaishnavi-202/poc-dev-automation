trigger:
- POC_SMOKE

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  displayName: "Checkout source code"

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.9'
  displayName: "Use Python 3.9"

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: "Install dependencies (demo)"

- script: |
    echo "Skipping pywinauto execution (Linux agent)"
    pytest --collect-only
  displayName: "Demo: validate test discovery"
