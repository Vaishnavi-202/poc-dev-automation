# Azure Pipeline – UI Automation (Allure + UI)

trigger:
  branches:
    include:
      - main
      - POC_SMOKE

pool:
  name: local-docker-agent      # Self-hosted agent pool
  demands:
    - Agent.Name -equals local-docker-01

steps:

# 1️ Checkout source code

- checkout: self

# 2️ Install Python dependencies

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest allure-pytest
  displayName: 'Install test dependencies'

# 3️ Run UI automation tests (interactive session)

- script: |
    echo Running UI tests in interactive desktop session
    pytest .\tests\wja\poc ^
      --alluredir=allure-results ^
      -p no:xdist ^
      -p no:rerunfailures
  displayName: 'Run POC UI test cases'
  condition: succeededOrFailed()

# 4️ Auto-open + auto-close Allure Report (LOCAL)

- script: |
    echo Starting Allure server (auto-close in 30 seconds)
    start "" cmd /c "allure serve allure-results"
    timeout /t 30 /nobreak
    echo Stopping Allure server
    taskkill /IM java.exe /F
  displayName: 'Serve Allure Report (auto-open & auto-close)'
  condition: succeededOrFailed()

# 5 Publish Allure HTML as Azure Artifact

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'allure-report'
    artifact: 'Allure-HTML-Report'
  displayName: 'Publish Allure HTML Report'
  condition: succeededOrFailed()
