trigger:
  branches:
    include:
      - main
      - POC_SMOKE

pool:
  name: local-docker-agent
  demands:
    - Agent.Name -equals local-docker-01

steps:
# 1️ Checkout
- checkout: self

# 2️ Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest allure-pytest
  displayName: 'Install test dependencies'

# 3️ Run UI tests (interactive foreground)
- script: |
    cmd /c "start /wait pytest .\tests\wja\poc --alluredir=allure-results -p no:xdist"
  displayName: 'Run POC UI test cases (foreground)'

# 4️ Publish Allure raw results
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'allure-results'
    artifact: 'allure-results'
  displayName: 'Publish Allure Results'

# 5️ Serve Allure report locally (agent desktop)
- script: |
    allure serve allure-results
  displayName: 'Serve Allure Report (local)'
  condition: succeededOrFailed()
