# Starter pipeline
#trigger:
#  branches:
#    include:
#      - main
#      - POC_SMOKE

trigger:
  branches:
    include:
      - none

pool:
  name: local-docker-agent   # Self-hosted Windows agent
  demands:
    - Agent.Name -equals local-docker-02

steps:
# 1️ Checkout code
- checkout: self

# 2️ Verify Python (interactive session check)

- script: |
    echo Checking Python installation
    python --version
    pip --version
  displayName: 'Verify Python'
  
# 3️ Install dependencies
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest allure-pytest
  displayName: 'Install test dependencies'

# 4️ Run POC tests (interactive UI)
- script: |
    echo Running test in interactive desktop
    cmd /c "start /wait pytest ./tests/wja/poc --alluredir=allure-results -p no:xdist -p no:rerunfailures"
  displayName: 'Run POC UI test cases (foreground)'

# 5️ Publish Allure raw results
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'allure-results'
    artifact: 'allure-results'
  displayName: 'Publish Allure Results'
