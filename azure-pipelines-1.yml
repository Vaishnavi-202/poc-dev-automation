# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main
- POC_SMOKE

pool:
  name: local-docker-agent   # Windows self-hosted agent

steps:
- checkout: self

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
    githubToken: $(GITHUB_TOKEN)

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    pip install pytest allure-pytest
    pytest .\tests\wja\poc --alluredir=allure-results
  displayName: 'Run POC test cases'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'allure-results'
    artifact: 'allure-results'
  displayName: 'Publish Allure Results'

- script: |
    allure generate allure-results -o allure-report --clean
  displayName: 'Generate Allure Report'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'allure-report'
    artifact: 'allure-report'
  displayName: 'Publish Allure Report'
