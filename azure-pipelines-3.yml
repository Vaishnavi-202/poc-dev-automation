trigger:
  branches:
    include:
      - main
      - POC_SMOKE

pool:
  name: local-docker-agent
  demands:
    - Agent.Name -equals local-docker-02

steps:
- checkout: self

- script: |
    echo Checking Python installation
    python --version
    pip --version
  displayName: "Verify Python"

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest allure-pytest
  displayName: "Install test dependencies"

# --- Define absolute output paths (no ambiguity) ---
- powershell: |
    $resultsDir = "$(System.DefaultWorkingDirectory)\allure-results"
    $reportDir  = "$(System.DefaultWorkingDirectory)\allure-report"
    $junitPath  = "$(System.DefaultWorkingDirectory)\pytest-junit.xml"
    $zipPath    = "$(System.DefaultWorkingDirectory)\allure-report.zip"

    Write-Host "##vso[task.setvariable variable=ALLURE_RESULTS_DIR]$resultsDir"
    Write-Host "##vso[task.setvariable variable=ALLURE_REPORT_DIR]$reportDir"
    Write-Host "##vso[task.setvariable variable=JUNIT_XML_PATH]$junitPath"
    Write-Host "##vso[task.setvariable variable=ALLURE_ZIP_PATH]$zipPath"

    Write-Host "Paths set:"
    Write-Host "ALLURE_RESULTS_DIR = $resultsDir"
    Write-Host "ALLURE_REPORT_DIR  = $reportDir"
    Write-Host "JUNIT_XML_PATH     = $junitPath"
    Write-Host "ALLURE_ZIP_PATH    = $zipPath"
  displayName: "Set output paths"
  condition: always()

# --- Run pytest (no start/wait) ---
- script: |
    echo Running tests...
    pytest ./tests/wja/poc --alluredir="$(ALLURE_RESULTS_DIR)" --junitxml="$(JUNIT_XML_PATH)" -p no:xdist -p no:rerunfailures -vv
  displayName: "Run POC UI test cases"
  continueOnError: true

# --- Debug: prove what pytest produced (THIS will tell us the truth) ---
- powershell: |
    Write-Host "=== DEBUG: Did pytest generate JUnit XML? ==="
    if (Test-Path "$(JUNIT_XML_PATH)") {
      Write-Host "FOUND: $(JUNIT_XML_PATH)"
      Get-Item "$(JUNIT_XML_PATH)" | Format-List
    } else {
      Write-Host "MISSING: $(JUNIT_XML_PATH)"
    }

    Write-Host "=== DEBUG: What is inside allure-results? ==="
    if (Test-Path "$(ALLURE_RESULTS_DIR)") {
      Get-ChildItem -Path "$(ALLURE_RESULTS_DIR)" -Recurse | Select-Object FullName, Length
      $jsonCount = (Get-ChildItem "$(ALLURE_RESULTS_DIR)" -Filter "*.json" -Recurse -ErrorAction SilentlyContinue | Measure-Object).Count
      Write-Host "Allure JSON file count: $jsonCount"
      Write-Host "##vso[task.setvariable variable=ALLURE_JSON_COUNT]$jsonCount"
    } else {
      Write-Host "allure-results folder NOT found."
      Write-Host "##vso[task.setvariable variable=ALLURE_JSON_COUNT]0"
    }
  displayName: "Debug: Verify outputs"
  condition: always()

# --- Download Allure CLI (no Chocolatey) ---
- powershell: |
    $ErrorActionPreference = "Stop"

    $allureVersion = "2.27.0"
    $zipUrl = "https://github.com/allure-framework/allure2/releases/download/$allureVersion/allure-$allureVersion.zip"
    $downloadPath = "$(System.DefaultWorkingDirectory)\allure.zip"
    $extractPath = "$(System.DefaultWorkingDirectory)\allure-cli"

    Invoke-WebRequest -Uri $zipUrl -OutFile $downloadPath
    Expand-Archive $downloadPath -DestinationPath $extractPath -Force

    $allureRoot = Get-ChildItem $extractPath | Where-Object { $_.PSIsContainer } | Select-Object -First 1
    $allureBin = Join-Path $allureRoot.FullName "bin"
    $allureExe = Join-Path $allureBin "allure.bat"

    if (-not (Test-Path $allureExe)) { throw "Allure executable not found at $allureExe" }

    Write-Host "##vso[task.setvariable variable=ALLURE_EXE]$allureExe"
    & $allureExe --version
  displayName: "Download Allure CLI"
  condition: always()

# --- Generate static Allure report ONLY if JSON exists ---
- powershell: |
    $ErrorActionPreference = "Stop"

    if ([int]"$(ALLURE_JSON_COUNT)" -le 0) {
      Write-Host "Skipping Allure HTML generation because ALLURE_JSON_COUNT=$(ALLURE_JSON_COUNT)."
      Write-Host "##vso[task.setvariable variable=ALLURE_HTML_READY]false"
      exit 0
    }

    if (Test-Path "$(ALLURE_REPORT_DIR)") { Remove-Item "$(ALLURE_REPORT_DIR)" -Recurse -Force }

    & "$(ALLURE_EXE)" generate "$(ALLURE_RESULTS_DIR)" --clean -o "$(ALLURE_REPORT_DIR)"

    if (Test-Path "$(ALLURE_REPORT_DIR)\index.html") {
      Write-Host "Allure HTML generated successfully."
      Write-Host "##vso[task.setvariable variable=ALLURE_HTML_READY]true"
    } else {
      Write-Host "Allure HTML generation ran but index.html is missing."
      Write-Host "##vso[task.setvariable variable=ALLURE_HTML_READY]false"
    }
  displayName: "Generate Allure HTML (static)"
  condition: always()

# --- Zip report ONLY if HTML exists ---
- powershell: |
    if ("$(ALLURE_HTML_READY)" -ne "true") {
      Write-Host "Skipping ZIP because Allure HTML not ready."
      Write-Host "##vso[task.setvariable variable=ALLURE_ZIP_READY]false"
      exit 0
    }

    if (Test-Path "$(ALLURE_ZIP_PATH)") { Remove-Item "$(ALLURE_ZIP_PATH)" -Force }

    Compress-Archive -Path "$(ALLURE_REPORT_DIR)\*" -DestinationPath "$(ALLURE_ZIP_PATH)" -Force

    if (Test-Path "$(ALLURE_ZIP_PATH)") {
      Write-Host "Allure ZIP created: $(ALLURE_ZIP_PATH)"
      Write-Host "##vso[task.setvariable variable=ALLURE_ZIP_READY]true"
    } else {
      Write-Host "Failed to create ZIP."
      Write-Host "##vso[task.setvariable variable=ALLURE_ZIP_READY]false"
    }
  displayName: "Zip Allure report"
  condition: always()

# --- Publish HTML as artifact (nice-to-have fallback) ---
- task: PublishBuildArtifacts@1
  displayName: "Publish Allure HTML Artifact"
  condition: always()
  inputs:
    PathtoPublish: "$(ALLURE_REPORT_DIR)"
    ArtifactName: "AllureReport"
    publishLocation: "Container"

# --- Email summary + (optional) attachment if ZIP exists ---
- powershell: |
    [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

    $smtpServer = "smtp.gmail.com"
    $smtpPort   = 587
    $smtpUser   = "$(SMTP_USER)"
    $smtpPass   = "$(SMTP_PASSWORD)"

    $from = $smtpUser
    $to   = @("qa1@gmail.com","qa2@gmail.com")

    $status = $env:AGENT_JOBSTATUS
    if ([string]::IsNullOrWhiteSpace($status)) { $status = "Unknown" }

    # -------- JUnit summary ----------
    $junitPath = "$(JUNIT_XML_PATH)"

    $tests = $passed = $failures = $errors = $skipped = 0
    $failedNames = @()

    if (Test-Path $junitPath) {
      [xml]$j = Get-Content $junitPath

      $suiteNodes = @()
      if ($j.testsuite) { $suiteNodes = @($j.testsuite) }
      elseif ($j.testsuites -and $j.testsuites.testsuite) { $suiteNodes = @($j.testsuites.testsuite) }

      foreach ($s in $suiteNodes) {
        $tests    += [int]$s.tests
        $failures += [int]$s.failures
        $errors   += [int]$s.errors
        $skipped  += [int]$s.skipped

        if ($s.testcase) {
          foreach ($tc in $s.testcase) {
            if ($tc.failure -or $tc.error) {
              $name = $tc.name
              if ($tc.classname) { $name = "$($tc.classname)::$($tc.name)" }
              $failedNames += $name
            }
          }
        }
      }

      $passed = $tests - $failures - $errors - $skipped
      if ($passed -lt 0) { $passed = 0 }
      $failedNames = $failedNames | Select-Object -First 10
    } else {
      $failedNames = @("JUnit report not found at: $junitPath")
    }

    $artifactLink = "$env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$env:SYSTEM_TEAMPROJECT/_build/results?buildId=$env:BUILD_BUILDID&view=artifacts&type=publishedArtifacts"
    $buildLink    = "$env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$env:SYSTEM_TEAMPROJECT/_build/results?buildId=$env:BUILD_BUILDID"

    $lines = @(
      "Hello Team,",
      "",
      "POC UI Test execution is completed.",
      "",
      "Status   : $status",
      "Pipeline : $env:BUILD_DEFINITIONNAME",
      "Build #  : $env:BUILD_BUILDNUMBER",
      "",
      "Test Summary (Pytest):",
      "Total   : $tests",
      "Passed  : $passed",
      "Failed  : $failures",
      "Errors  : $errors",
      "Skipped : $skipped",
      "",
      "Allure JSON Count: $(ALLURE_JSON_COUNT)",
      ""
    )

    if ($failedNames.Count -gt 0 -and $failedNames[0] -notlike "JUnit report not found*") {
      $lines += "Top Failures (up to 10):"
      foreach ($f in $failedNames) { $lines += " - $f" }
      $lines += ""
    } elseif ($failedNames.Count -gt 0) {
      $lines += "Note:"
      foreach ($f in $failedNames) { $lines += " - $f" }
      $lines += ""
    }

    if ("$(ALLURE_ZIP_READY)" -eq "true") {
      $lines += "Allure Detailed Report: Attached as allure-report.zip"
      $lines += ""
    } else {
      $lines += "Allure Detailed Report (Artifact fallback):"
      $lines += $artifactLink
      $lines += ""
      $lines += "If the report looks empty, it means allure-results had no JSON files."
      $lines += ""
    }

    $lines += @(
      "Build Link:",
      $buildLink,
      "",
      "Regards,",
      "Azure DevOps CI"
    )

    $body = $lines -join "`r`n"

    $securePass = ConvertTo-SecureString $smtpPass -AsPlainText -Force
    $cred = New-Object System.Management.Automation.PSCredential ($smtpUser, $securePass)

    if ("$(ALLURE_ZIP_READY)" -eq "true" -and (Test-Path "$(ALLURE_ZIP_PATH)")) {
      Send-MailMessage `
        -From $from `
        -To $to `
        -Subject "POC UI Tests - $status | Build $env:BUILD_BUILDNUMBER" `
        -Body $body `
        -SmtpServer $smtpServer `
        -Port $smtpPort `
        -UseSsl `
        -Credential $cred `
        -Attachments "$(ALLURE_ZIP_PATH)"
    } else {
      Send-MailMessage `
        -From $from `
        -To $to `
        -Subject "POC UI Tests - $status | Build $env:BUILD_BUILDNUMBER" `
        -Body $body `
        -SmtpServer $smtpServer `
        -Port $smtpPort `
        -UseSsl `
        -Credential $cred
    }
  displayName: "Send Email Notification"
  condition: always()
