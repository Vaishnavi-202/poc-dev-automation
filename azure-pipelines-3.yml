trigger:
  branches:
    include:
      - main
      - POC_SMOKE

pool:
  name: local-docker-agent
  demands:
    - Agent.Name -equals local-docker-02

variables:
  ALLURE_RESULTS: '$(Build.SourcesDirectory)\allure-results'
  ALLURE_REPORT:  '$(Build.SourcesDirectory)\allure-report'
  JUNIT_XML:      '$(Build.SourcesDirectory)\pytest-junit.xml'

steps:
- checkout: self

- script: |
    echo Checking Python installation
    python --version
    pip --version
  displayName: "Verify Python"

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest allure-pytest
  displayName: "Install test dependencies"

# Clean output folders up-front to avoid mixing runs
- powershell: |
    $ErrorActionPreference = "Stop"
    if (Test-Path "$(ALLURE_RESULTS)") { Remove-Item "$(ALLURE_RESULTS)" -Recurse -Force }
    if (Test-Path "$(ALLURE_REPORT)")  { Remove-Item "$(ALLURE_REPORT)"  -Recurse -Force }
    if (Test-Path "$(JUNIT_XML)")      { Remove-Item "$(JUNIT_XML)"      -Force }
    New-Item -ItemType Directory -Path "$(ALLURE_RESULTS)" | Out-Null
    Write-Host "Prepared: $(ALLURE_RESULTS)"
  displayName: "Prep Allure folders"
  condition: always()

# IMPORTANT: run pytest in the SAME working directory and write to ABSOLUTE alluredir
- script: |
    echo Running UI tests...
    pytest ./tests/wja/poc --alluredir="$(ALLURE_RESULTS)" --clean-alluredir --junitxml="$(JUNIT_XML)" -p no:xdist -p no:rerunfailures
  displayName: "Run POC UI test cases"
  condition: always()

# Verify Allure results are actually created (if 0 json files -> report will be empty)
- powershell: |
    $ErrorActionPreference = "Stop"
    Write-Host "Allure results path: $(ALLURE_RESULTS)"
    if (!(Test-Path "$(ALLURE_RESULTS)")) { throw "Allure results folder missing." }

    $json = Get-ChildItem -Path "$(ALLURE_RESULTS)" -Filter *.json -File -ErrorAction SilentlyContinue
    Write-Host "Allure JSON count: $($json.Count)"

    # show a few files for confidence
    Get-ChildItem "$(ALLURE_RESULTS)" | Select-Object -First 20 | ForEach-Object { Write-Host $_.Name }

    if ($json.Count -eq 0) {
      throw "No Allure JSON files found. Report will be empty. (pytest didn't write results to $(ALLURE_RESULTS))"
    }
  displayName: "Verify Allure results not empty"
  condition: always()

# Download Allure CLI (portable, no Chocolatey)
- powershell: |
    $ErrorActionPreference = "Stop"

    $ver = "2.27.0"
    $url = "https://github.com/allure-framework/allure2/releases/download/$ver/allure-$ver.zip"
    $zip = "$(Pipeline.Workspace)\allure-$ver.zip"
    $dir = "$(Pipeline.Workspace)\allure-$ver"

    Invoke-WebRequest -Uri $url -OutFile $zip
    if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
    Expand-Archive -Path $zip -DestinationPath $dir -Force

    $allureBat = Join-Path $dir "allure-$ver\bin\allure.bat"
    if (!(Test-Path $allureBat)) { throw "Allure not found at $allureBat" }

    Write-Host "##vso[task.setvariable variable=ALLURE_BAT]$allureBat"
    & $allureBat --version
  displayName: "Download Allure CLI (portable)"
  condition: always()

# Generate the static HTML report
- powershell: |
    $ErrorActionPreference = "Stop"

    $allureBat = "$(ALLURE_BAT)"
    if (!(Test-Path $allureBat)) { throw "ALLURE_BAT not found: $allureBat" }

    & $allureBat generate "$(ALLURE_RESULTS)" -o "$(ALLURE_REPORT)" --clean

    if (!(Test-Path "$(ALLURE_REPORT)\index.html")) {
      throw "Allure report not generated (index.html missing)."
    }

    Write-Host "Allure HTML ready: $(ALLURE_REPORT)"
  displayName: "Generate Allure HTML report"
  condition: always()

# Publish artifacts
- task: PublishPipelineArtifact@1
  displayName: "Publish Allure HTML report (artifact)"
  inputs:
    targetPath: "$(ALLURE_REPORT)"
    artifactName: "allure-report"
  condition: always()

- task: PublishPipelineArtifact@1
  displayName: "Publish Allure results (raw)"
  inputs:
    targetPath: "$(ALLURE_RESULTS)"
    artifactName: "allure-results"
  condition: always()

- task: PublishPipelineArtifact@1
  displayName: "Publish Pytest JUnit XML"
  inputs:
    targetPath: "$(JUNIT_XML)"
    artifactName: "pytest-junit.xml"
  condition: always()

# Email notification (includes artifacts page link)
- powershell: |
    [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

    $smtpServer = "smtp.gmail.com"
    $smtpPort   = 587
    $smtpUser   = "$(SMTP_USER)"
    $smtpPass   = "$(SMTP_PASSWORD)"

    if ([string]::IsNullOrWhiteSpace($smtpUser)) { throw "SMTP_USER is empty." }
    if ([string]::IsNullOrWhiteSpace($smtpPass)) { throw "SMTP_PASSWORD is empty (secret var)." }

    $from = $smtpUser
    $to   = @("qa1@gmail.com","qa2@gmail.com")

    $status = $env:AGENT_JOBSTATUS
    if ([string]::IsNullOrWhiteSpace($status)) { $status = "Unknown" }

    $artifactLink = "$env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$env:SYSTEM_TEAMPROJECT/_build/results?buildId=$env:BUILD_BUILDID&view=artifacts&type=publishedArtifacts"
    $buildLink    = "$env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$env:SYSTEM_TEAMPROJECT/_build/results?buildId=$env:BUILD_BUILDID"

    $body = @(
      "Hello Team,",
      "",
      "POC UI Test execution is completed.",
      "",
      "Status   : $status",
      "Pipeline : $env:BUILD_DEFINITIONNAME",
      "Build #  : $env:BUILD_BUILDNUMBER",
      "",
      "Allure HTML Report (Artifact):",
      $artifactLink,
      "",
      "Build Link:",
      $buildLink,
      "",
      "Regards,",
      "Azure DevOps CI"
    ) -join "`r`n"

    $securePass = ConvertTo-SecureString $smtpPass -AsPlainText -Force
    $cred = New-Object System.Management.Automation.PSCredential ($smtpUser, $securePass)

    Send-MailMessage `
      -From $from `
      -To $to `
      -Subject "POC UI Tests - $status | Build $env:BUILD_BUILDNUMBER" `
      -Body $body `
      -SmtpServer $smtpServer `
      -Port $smtpPort `
      -UseSsl `
      -Credential $cred
  displayName: "Send Email Notification"
  condition: always()
