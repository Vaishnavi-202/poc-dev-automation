trigger:
  branches:
    include:
      - POC_SMOKE

pool:
  name: local-docker-agent
  demands:
    - Agent.Name -equals local-docker-02

steps:
- checkout: self

- script: |
    echo Checking Python installation
    python --version
    pip --version
  displayName: "Verify Python"

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest allure-pytest
  displayName: "Install test dependencies"

- script: |
    echo Running test in interactive desktop
    "pytest ./tests/wja/poc --alluredir=allure-results --junitxml=pytest-junit.xml -p no:xdist -p no:rerunfailures"
  displayName: "Run POC UI test cases (foreground)"
  continueOnError: true

- powershell: |
    $ErrorActionPreference = "Stop"

    $allureVersion = "2.27.0"
    $zipUrl = "https://github.com/allure-framework/allure2/releases/download/$allureVersion/allure-$allureVersion.zip"
    $downloadPath = "$(System.DefaultWorkingDirectory)\allure.zip"
    $extractPath = "$(System.DefaultWorkingDirectory)\allure-cli"

    Write-Host "Downloading Allure CLI..."
    Invoke-WebRequest -Uri $zipUrl -OutFile $downloadPath

    Write-Host "Extracting Allure CLI..."
    Expand-Archive $downloadPath -DestinationPath $extractPath -Force

    # Save full path to bin in pipeline variable
    $allureRoot = Get-ChildItem $extractPath | Where-Object { $_.PSIsContainer } | Select-Object -First 1
    $allureBin = Join-Path $allureRoot.FullName "bin"

    Write-Host "##vso[task.setvariable variable=ALLURE_BIN]$allureBin"
  displayName: "Download & Setup Allure CLI"
  condition: always()

- powershell: |
    if (-not (Test-Path "allure-report\index.html")) {
      throw "Allure report not generated."
    }

    $zipPath = "$(System.DefaultWorkingDirectory)\allure-report.zip"

    if (Test-Path $zipPath) {
      Remove-Item $zipPath -Force
    }

    Compress-Archive -Path "allure-report\*" -DestinationPath $zipPath

    Write-Host "##vso[task.setvariable variable=ALLURE_ZIP]$zipPath"
  displayName: "Zip Allure Report"
  condition: always()

- task: PublishBuildArtifacts@1
  displayName: "Publish Allure HTML Artifact"
  condition: always()
  inputs:
    PathtoPublish: "allure-report"
    ArtifactName: "AllureReport"
    publishLocation: "Container"

- powershell: |
    [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

    $smtpServer = "smtp.gmail.com"
    $smtpPort   = 587
    $smtpUser   = "$(SMTP_USER)"
    $smtpPass   = "$(SMTP_PASSWORD)"

    if ([string]::IsNullOrWhiteSpace($smtpUser)) { throw "SMTP_USER is empty. Set it in pipeline variables." }
    if ([string]::IsNullOrWhiteSpace($smtpPass)) { throw "SMTP_PASSWORD is empty. Set it as a secret pipeline variable (Gmail App Password)." }

    $from = $smtpUser
    $to   = @("qa1@gmail.com","qa2@gmail.com")

    $status = $env:AGENT_JOBSTATUS
    if ([string]::IsNullOrWhiteSpace($status)) { $status = "Unknown" }

    # -------- JUnit summary (from pytest-junit.xml) ----------
    $junitPath = Join-Path $env:SYSTEM_DEFAULTWORKINGDIRECTORY "pytest-junit.xml"

    $tests = $passed = $failures = $errors = $skipped = 0
    $failedNames = @()

    if (Test-Path $junitPath) {
      [xml]$j = Get-Content $junitPath

      $suiteNodes = @()
      if ($j.testsuite) { $suiteNodes = @($j.testsuite) }
      elseif ($j.testsuites -and $j.testsuites.testsuite) { $suiteNodes = @($j.testsuites.testsuite) }

      foreach ($s in $suiteNodes) {
        $tests    += [int]$s.tests
        $failures += [int]$s.failures
        $errors   += [int]$s.errors
        $skipped  += [int]$s.skipped

        if ($s.testcase) {
          foreach ($tc in $s.testcase) {
            if ($tc.failure -or $tc.error) {
              $name = $tc.name
              if ($tc.classname) { $name = "$($tc.classname)::$($tc.name)" }
              $failedNames += $name
            }
          }
        }
      }

      $passed = $tests - $failures - $errors - $skipped
      if ($passed -lt 0) { $passed = 0 }

      $failedNames = $failedNames | Select-Object -First 10
    } else {
      $failedNames = @("JUnit report not found at: $junitPath")
    }

    # Links
    $artifactLink = "$env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$env:SYSTEM_TEAMPROJECT/_build/results?buildId=$env:BUILD_BUILDID&view=artifacts&type=publishedArtifacts"
    $buildLink    = "$env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI$env:SYSTEM_TEAMPROJECT/_build/results?buildId=$env:BUILD_BUILDID"

    $lines = @(
      "Hello Team,",
      "",
      "POC UI Test execution is completed.",
      "",
      "Status   : $status",
      "Pipeline : $env:BUILD_DEFINITIONNAME",
      "Build #  : $env:BUILD_BUILDNUMBER",
      "",
      "Test Summary (Pytest):",
      "Total   : $tests",
      "Passed  : $passed",
      "Failed  : $failures",
      "Errors  : $errors",
      "Skipped : $skipped",
      ""
    )

    if ($failedNames.Count -gt 0 -and $failedNames[0] -notlike "JUnit report not found*") {
      $lines += "Top Failures (up to 10):"
      foreach ($f in $failedNames) { $lines += " - $f" }
      $lines += ""
    } elseif ($failedNames.Count -gt 0) {
      $lines += "Note:"
      foreach ($f in $failedNames) { $lines += " - $f" }
      $lines += ""
    }

    $lines += @(
      "Allure HTML Report (Artifact):",
      $artifactLink,
      "",
      "Build Link:",
      $buildLink,
      "",
      "Open steps for report:",
      "1) Click the Allure HTML Report link",
      "2) Artifacts -> AllureReport -> index.html",
      "",
      "Regards,",
      "Azure DevOps CI"
    )

    $body = $lines -join "`r`n"

    $securePass = ConvertTo-SecureString $smtpPass -AsPlainText -Force
    $cred = New-Object System.Management.Automation.PSCredential ($smtpUser, $securePass)

    Send-MailMessage `
      -From $from `
      -To $to `
      -Subject "POC UI Tests - $status | Build $env:BUILD_BUILDNUMBER" `
      -Body $body `
      -SmtpServer $smtpServer `
      -Port $smtpPort `
      -UseSsl `
      -Credential $cred
  displayName: "Send Email Notification"
  condition: always()
